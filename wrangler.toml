# Must match the Worker name in Cloudflare Dashboard → Settings → Builds (Git integration).
name = "theislecheats-cc-new3"
main = "worker.mjs"
compatibility_date = "2026-09-12"
workers_dev = true

# Local `wrangler deploy` only; Workers Builds runs `npm run build` from the dashboard first.
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"

[[routes]]
pattern = "theislecheats.cc"
custom_domain = true

[[routes]]
pattern = "www.theislecheats.cc"
custom_domain = true
