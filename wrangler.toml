# Cloudflare Workers static assets — build must run before deploy (generates worker.entry.mjs).
name = "theisle-cheats-cc"
main = "worker.entry.mjs"
compatibility_date = "2026-09-12"
workers_dev = true

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"

[[routes]]
pattern = "theislecheats.cc"
custom_domain = true

[[routes]]
pattern = "www.theislecheats.cc"
custom_domain = true
